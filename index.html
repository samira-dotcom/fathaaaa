<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💘</title>

<style>
body {
  font-family: 'Comic Sans MS', cursive;
  background: radial-gradient(circle, #ff9aa2, #ffb7c5);
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  z-index: 2;
  width: 420px;
}

h1 {
  color: #ff3b6f;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  border: none;
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.25s ease;
  position: absolute;
}

#yesBtn {
  background: #ff3b6f;
  color: white;
  left: 30%;
}

#noBtn {
  background: #ddd;
  right: 30%;
}

.heart {
  position: absolute;
  color: pink;
  font-size: 22px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from {
    transform: translateY(100vh) scale(1);
  }
  to {
    transform: translateY(-10vh) scale(1.8);
  }
}
</style>
</head>

<body>

<audio id="music" autoplay loop>

</audio>
